<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="color-scheme" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header" role="banner">
      <div class="site-header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="site-brand__name">Guanjie Li</span>
          <span class="site-brand__publication">Thinking Out Louder</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ site.owner.linkedin }}">LinkedIn<span class="external-mark" aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="content" class="site-main" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>Notes on minds, machines, and the users between them.</p>
        <p>&copy; {{ site.time | date: '%Y' }} Guanjie Li</p>
      </div>
    </footer>
  </body>
</html>
